<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Logo GNOTA">
  <defs>
    <linearGradient id="gnotaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="gnotaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="110" cy="110" r="102" fill="#FFFFFF" stroke="url(#gnotaBlue)" stroke-width="8"/>
  <circle cx="110" cy="110" r="92" fill="#F0F7FF"/>

  <!-- Protective Hands / Embrace Arc (Orange) -->
  <path d="M44 128 C44 164, 176 164, 176 128 C176 144, 146 156, 110 156 C74 156, 44 144, 44 128 Z" fill="url(#gnotaOrange)"/>

  <!-- Adult / Orang Tua Asuh Figure (Blue) -->
  <circle cx="84" cy="70" r="15" fill="url(#gnotaBlue)"/>
  <path d="M56 122 C56 98, 72 90, 88 90 C102 90, 112 98, 116 112 C104 112, 92 118, 86 130 L56 128 Z" fill="url(#gnotaBlue)"/>

  <!-- Child / Anak Asuh Figure (Orange) -->
  <circle cx="132" cy="84" r="12" fill="url(#gnotaOrange)"/>
  <path d="M108 130 C110 110, 120 102, 134 102 C148 102, 158 110, 160 128 L108 130 Z" fill="url(#gnotaOrange)"/>

  <!-- Open Book Accent -->
  <path d="M84 134 Q110 124 110 138 Q110 124 136 134 L136 145 Q110 136 110 148 Q110 136 84 145 Z" fill="#0D47A1"/>

  <!-- GNOTA Wordmark -->
  <text x="110" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="#0D47A1">GNOTA</text>
</svg>
